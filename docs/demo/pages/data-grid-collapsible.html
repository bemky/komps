<!--
title: Data Grid Collapsible
-->
<style>
    main { height: 600px; overflow: hidden; display: flex; flex-direction: column; }
    #controls {
        flex: none; margin: 0 0 .5rem; color: #555;
        font: 13px/1.4 system-ui, sans-serif;
        display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    }
    #controls b { color: #1a73e8; }
    #controls select { font: inherit; padding: .1em .2em; }
    #container { flex: 1 1 auto; min-height: 0; }

    /* DataGrid is style-less; the demo supplies presentational CSS. */
    komp-data-grid {
        --dg-cell-bg: #fff;
        height: 100%; width: 100%;
        border: 1px solid #ccc; border-radius: 6px;
        font: 13px/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums;
    }
    komp-data-grid-header-cell {
        padding: .45em .6em; font-weight: 600;
        border-right: 1px solid #eee; border-bottom: 2px solid #ddd;
        background: #fafafa; white-space: nowrap;
    }
    komp-data-grid-cell {
        padding: .4em .6em;
        border-right: 1px solid hsl(0, 0%, 90%);
        border-bottom: 1px solid hsl(0, 0%, 90%);
    }
    komp-data-grid-cell.frozen,
    komp-data-grid-header-cell.frozen { box-shadow: 1px 0 0 #ddd; font-weight: 600; }
    /* Cells whose content is taller than the budget are what the plugin truncates —
       let this content wrap so there is something to truncate. */
    komp-data-grid-cell.wrap { white-space: pre-line; }
</style>

<div id="controls">
    <label>Cell content budget (<code>collapseTo</code>):
        <select id="budget">
            <option value="1lh">1lh (one line)</option>
            <option value="3lh" selected>3lh</option>
            <option value="6lh">6lh</option>
            <option value="50px">50px</option>
            <option value="auto">auto (no clamp)</option>
        </select>
    </label>
    <span id="status">loading…</span>
</div>
<div id="container"></div>

<script type="module">
    import DataGrid from './lib/komps/data-grid.js';
    import { collapsible } from './lib/komps/data-grid/plugins.js';

    DataGrid.include(collapsible);

    const RATINGS = ['hgt','stre','spd','jmp','endu','ins','dnk','ft','fg','tp','oiq','diq','drb','pss','reb'];

    const db = await fetch('/nba-players.json').then(r => r.json());
    const players = db.players;
    const teamAbbrev = Object.fromEntries(db.teams.map(t => [t.tid, t.abbrev]));

    const grid = new DataGrid({
        data: players,
        collapseTo: '3lh',
        columns: [
            { header: 'Player', width: 170, frozen: true,
              render: r => `${r.firstName} ${r.lastName}` },
            { header: 'Team', width: 70, render: r => teamAbbrev[r.tid] ?? r.tid },
            { header: 'College', width: 150, render: r => r.college || '—' },
            { header: 'Awards', width: 260, class: 'wrap',
              render: r => (r.awards || []).map(a => `${a.season} · ${a.type}`).join('\n') || '—' },
            { header: 'Ratings', width: 300, class: 'wrap',
              render: r => RATINGS.map(k => `${k.toUpperCase()} ${r.ratings?.[k] ?? '—'}`).join(', ') },
            { header: 'Hgt', width: 56, attribute: 'hgt' },
            { header: 'Wt', width: 56, attribute: 'weight' }
        ]
    });
    document.getElementById('container').append(grid);

    // collapseTo is a watched attribute — assigning it re-publishes --collapseTo and the
    // grid's measure/reflow pipeline picks up the new row heights.
    document.getElementById('budget').addEventListener('change', e => {
        grid.collapseTo = e.target.value;
    });

    const status = document.getElementById('status');
    const update = () => {
        const expanded = (grid.rows ?? []).filter(r => r.expandedColumns?.size).length;
        status.innerHTML = `· <b>${expanded}</b> row${expanded === 1 ? '' : 's'} expanded · ` +
            `<i>hover a truncated cell and click the ⤢ in its corner to expand the row to that cell's full content; the same button collapses it again</i>`;
    };
    grid.addEventListener('rendered', update);
    grid.addEventListener('scroll', update);
    setInterval(update, 400);
</script>
